<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Ulik - 16-Bit Heart Hunt</title>
  <style>
    /* Import 16-bit Pixel Font */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background-color: #1a1a2e; /* Dark Arcade Cabinet background */
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* Top Text Area */
    .text-container {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }

    .text-container p {
      font-size: 10px;
      color: #b8b8d1;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .text-container h1 {
      font-size: 24px;
      color: #ff4d6d; /* Neon Pink/Red */
      margin: 0;
      text-shadow: 3px 3px 0px #701020; /* Blocky retro shadow */
    }

    .pulse {
      animation: retroPulse 1s infinite;
    }

    /* 16-Bit Game Window */
    .game-window {
      width: 90%;
      max-width: 500px;
      height: 400px;
      background-color: #0f0f1b; /* Pitch black game area */
      border: 6px solid #d4af37; /* Gold arcade bezel */
      box-shadow: 
        inset 0 0 15px rgba(0,0,0,0.8),
        0 0 0 4px #8b6b22, /* Outer Bezel shadow */
        0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      cursor: crosshair; /* Target reticle cursor */
    }

    /* Heads Up Display (HUD) */
    .hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
      z-index: 10;
    }

    .score-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-text { font-size: 14px; color: #fff; }
    .record-text { font-size: 10px; color: #fcd34d; }
    .lives-text { font-size: 14px; text-align: right; letter-spacing: 2px;}

    /* Game Objects */
    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 26px;
      text-shadow: 2px 2px 0px #000;
      z-index: 5;
      padding: 10px;
      margin: -10px;
    }

    .heart.pop {
      content: "💥";
      font-size: 32px;
      pointer-events: none;
      animation: popOut 0.2s forwards;
    }

    /* Game Over Screen */
    .game-over-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none; /* Hidden until triggered */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
    }

    .game-over-screen h2 {
      color: #ff4d6d;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #701020;
    }

    .blink-text {
      font-size: 12px;
      color: #fff;
      cursor: pointer;
      animation: blinker 1s linear infinite;
    }

    /* Instructions Below Game */
    .instructions {
      margin-top: 25px;
      max-width: 500px;
      background-color: #2a2a40;
      border: 3px dashed #4a4a6a;
      padding: 15px;
      font-size: 10px;
      line-height: 1.8;
      color: #d8d8e5;
      text-align: center;
    }

    .highlight { color: #fcd34d; }

    /* Animations */
    @keyframes retroPulse {
      0%, 100% { color: #ff4d6d; }
      50% { color: #ff8599; }
    }

    @keyframes popOut {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    @keyframes blinker {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="text-container">
    <p>THIS WEBSITE IS FREE TO USE FOR MY WIFE</p>
    <h1><span class="pulse">ULIK</span>, I LOVE YOU</h1>
  </div>

  <div class="game-window" id="game-window">
    
    <div class="hud">
      <div class="score-block">
        <div class="score-text">SCORE: <span id="score">0</span></div>
        <div class="record-text">MY RECORD: 42</div>
      </div>
      <div class="lives-text" id="lives">❤️❤️❤️</div>
    </div>

    <div class="game-over-screen" id="game-over">
      <h2>GAME OVER</h2>
      <div class="blink-text" id="restart-btn">> CLICK TO RESTART <</div>
    </div>

  </div>

  <div class="instructions">
    HOW TO PLAY:<br><br>
    Click (Shoot) the hearts before they fly off the screen. If you let <span class="highlight">3 HEARTS</span> escape, it's Game Over.<br><br>
    Can you beat my personal record of <span class="highlight">42</span>?
  </div>

  <script>
    const gameWindow = document.getElementById('game-window');
    const scoreDisplay = document.getElementById('score');
    const livesDisplay = document.getElementById('lives');
    const gameOverScreen = document.getElementById('game-over');
    const restartBtn = document.getElementById('restart-btn');

    let score = 0;
    let lives = 3;
    let gameActive = true;
    let spawnRate = 1200;
    let flightDuration = 4000;
    let spawnTimer;

    // Updates the HUD for health
    function updateLives() {
      let heartsHtml = "";
      for (let i = 0; i < 3; i++) {
        heartsHtml += (i < lives) ? "❤️" : "🖤";
      }
      livesDisplay.innerText = heartsHtml;
    }

    // Handles a heart escaping off the top
    function loseLife() {
      if (!gameActive) return;
      lives--;
      updateLives();
      
      // Trigger Red Flash
      gameWindow.style.backgroundColor = "#4a0e0e";
      setTimeout(() => {
        if(gameActive) gameWindow.style.backgroundColor = "#0f0f1b";
      }, 150);

      if (lives <= 0) {
        endGame();
      }
    }

    // Game Over sequence
    function endGame() {
      gameActive = false;
      clearTimeout(spawnTimer);
      gameOverScreen.style.display = 'flex';
      
      // Destroy all remaining active hearts on screen
      document.querySelectorAll('.heart').forEach(h => h.remove());
    }

    // Reset variables
    function restartGame() {
      score = 0;
      lives = 3;
      spawnRate = 1200;
      flightDuration = 4000;
      gameActive = true;
      scoreDisplay.innerText = score;
      updateLives();
      gameOverScreen.style.display = 'none';
      gameWindow.style.backgroundColor = "#0f0f1b";
      spawnHeart();
    }

    restartBtn.addEventListener('click', restartGame);

    function spawnHeart() {
      if (!gameActive) return;

      const heart = document.createElement('div');
      heart.innerText = '❤️';
      heart.className = 'heart';
      
      // Random X spawn point inside the box borders
      const startX = Math.random() * (gameWindow.offsetWidth - 50);
      heart.style.left = startX + 'px';

      // Random drift angle
      const drift = Math.random() * 80 - 40; 
      
      // Unique flight animation to prevent CSS caching issues
      const animName = 'fly' + Math.random().toString(36).substr(2, 5);
      const styleSheet = document.styleSheets[0];
      styleSheet.insertRule(`
        @keyframes ${animName} {
          0% { transform: translate(0, 0); }
          100% { transform: translate(${drift}px, -480px); }
        }
      `, styleSheet.cssRules.length);

      heart.style.animation = `${animName} ${flightDuration}ms linear forwards`;
      gameWindow.appendChild(heart);

      // SHOOTING LOGIC
      heart.addEventListener('mousedown', (e) => {
        if (!gameActive || heart.classList.contains('pop')) return;
        
        heart.classList.add('pop');
        heart.innerText = '💥'; // Turn heart into explosion emoji
        score++;
        scoreDisplay.innerText = score;

        // If she beats your record, make the score glow!
        if (score > 42) {
          scoreDisplay.style.color = '#50ff50';
          scoreDisplay.style.textShadow = '0 0 10px #50ff50';
        }

        // Increase Speed/Difficulty
        flightDuration = Math.max(1200, flightDuration * 0.96); 
        spawnRate = Math.max(450, spawnRate * 0.98);

        setTimeout(() => heart.remove(), 200);
      });

      // MISS LOGIC: If animation finishes and it hasn't been clicked
      heart.addEventListener('animationend', () => {
        if (heart.parentNode && !heart.classList.contains('pop')) {
          heart.remove();
          loseLife();
        }
      });

      // Loop Spawner
      spawnTimer = setTimeout(spawnHeart, spawnRate);
    }

    // Start game after a 1 second delay
    setTimeout(spawnHeart, 1000);
  </script>
</body>
</html>
